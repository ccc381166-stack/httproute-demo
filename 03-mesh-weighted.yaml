apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-mesh
  namespace: httproute-lab
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: inventory
      port: 8080
  rules:
    - matches:
        - headers:
            - name: x-release-cohort
              type: Exact
              value: canary
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-mesh-route
                value: mesh-canary
      backendRefs:
        - name: inventory-canary
          port: 8080
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-lab-mesh-route
                value: mesh-weighted
      backendRefs:
        - name: inventory-stable
          port: 8080
          weight: 90
        - name: inventory-canary
          port: 8080
          weight: 10
