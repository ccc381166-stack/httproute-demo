apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        version: v1
    spec:
      containers:
        - name: app
          image: python:3.13-slim
          command: ["python", "-u", "/code/app.py"]
          env:
            - {name: APP_ROLE, value: storefront}
            - {name: APP_VERSION, value: v1}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: code, mountPath: /code, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: demo-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector:
    app: inventory
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-stable
spec:
  selector:
    app: inventory
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: http
---
